# Journey: launch smoke — a fresh install opens on enrolment, with the organizer and exhibitor sign-in doors.
# Preconditions: an e2e build (APP_ENV=preview) pointed at any reachable server; no sign-in needed. A
#   development build opens the dev launcher first, so this does not run against one.
# Personas: none.
appId: com.yayatoh.staff.preview
---
- launchApp:
    clearState: true
- assertVisible: 'Enrol this device'
- assertVisible: 'Scan the enrolment QR code'
- assertVisible: 'Event organizer: sign in'
- assertVisible: 'Exhibitor: sign in'
