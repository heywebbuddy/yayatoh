# Journey: organizer sign-in with an authenticator code — email and password, then the second step; a wrong
#   email shape and a wrong code are refused with their messages, the current code from the authenticator
#   (scripts/totp.js, from the account's setup key) signs in, and the app opens the door tools.
# Preconditions: an e2e build pointed (API_BASE_URL) at a server with YAYATOH_DEV_AUTH=1; -e DEV_SERVER=<origin>
#   and -e DEV_PERSONA_PASSWORD=<the server's value> (or the MAESTRO_ prefixed environment variables).
# Personas: a throwaway organizer with two-step verification on (scripts/new-organizer.js).
appId: com.yayatoh.staff.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-organizer.js
- tapOn: 'Event organizer: sign in'
- assertVisible: 'Organizer sign-in'
# Validation first: an address that is not one.
- tapOn: 'Email address'
- inputText: 'not an email'
- tapOn: 'Continue'
- assertVisible: 'Enter a valid email address.'
- eraseText: 20
- inputText: ${output.email}
- tapOn: 'Password'
- inputText: ${output.password}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Enter the code from your authenticator app.*'
    timeout: 20000
# A wrong code is refused; the right one signs in.
- tapOn: 'Verification code'
- inputText: '000000'
- tapOn: 'Verify and sign in'
- assertVisible: 'That code is not right.*'
- runScript:
    file: scripts/totp.js
    env:
      SETUP_KEY: ${output.setupKey}
- tapOn: 'Verification code'
- eraseText: 6
- inputText: ${output.totp}
- tapOn: 'Verify and sign in'
- extendedWaitUntil:
    visible: 'Door tools'
    timeout: 30000
