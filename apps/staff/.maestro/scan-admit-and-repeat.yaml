# Journey: scan admit and duplicate — a typed code admits once, then the same code reports "Already scanned"
#   with when it was first admitted; the camera cannot be driven by Maestro, so the code goes in through
#   "Type a code", which is the same path as a scanned one.
# Preconditions: as enrol-by-link.yaml, plus -e TICKET_CODE=<short code of an active ticket> and
#   -e HOLDER_NAME=<its holder>.
# Personas: none (a door device); the ticket's holder is a seeded attendee.
appId: com.yayatoh.staff.preview
env:
  TICKET_CODE: ''
  HOLDER_NAME: ''
---
- runFlow: scan-setup.yaml
- tapOn:
    id: manual-open
- tapOn:
    id: manual-input
- inputText: ${TICKET_CODE}
- tapOn:
    id: manual-submit
- assertVisible: 'Admit'
- assertVisible: ${HOLDER_NAME}
- assertVisible:
    id: verdict-glyph-admit
# The same code again: a repeat, with the time of the first admission.
- tapOn:
    id: manual-input
- inputText: ${TICKET_CODE}
- tapOn:
    id: manual-submit
- assertVisible: 'Already scanned'
- assertVisible: 'First admitted at.*'
- assertVisible:
    id: verdict-glyph-warn
# One scan was queued per attempt and the phone is online, so the queue empties by itself.
- extendedWaitUntil:
    visible: 'All scans sent'
    timeout: 30000
