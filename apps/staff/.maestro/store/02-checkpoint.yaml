# Store screenshot 02-checkpoint for Yayatoh Staff (M7.5a). Written, not run in cloud sessions; `store/capture.sh`
# runs it on a simulator or emulator against a preview build, with the seeded reviewer demo
# (`pnpm reviewer-demo`, which prints ENROL_EVENT, ENROL_KEY, TICKET_CODE and HOLDER_NAME).
# Env: SHOT_DIR (where the PNG goes), ENROL_EVENT, ENROL_KEY, TICKET_CODE, HOLDER_NAME.
appId: com.yayatoh.staff.preview
env:
  SHOT_DIR: ./store/screenshots/manual
  ENROL_EVENT: ''
  ENROL_KEY: ''
  TICKET_CODE: ''
  HOLDER_NAME: ''
---
- launchApp:
    clearState: true
- openLink: 'yayatoh-staff-preview://scan#e=${ENROL_EVENT}&k=${ENROL_KEY}'
- extendedWaitUntil:
    visible: 'Where is this device scanning?'
    timeout: 20000
- takeScreenshot: ${SHOT_DIR}/02-checkpoint
