# Journey: scan manual validation — typing nothing is refused with a message that goes away as soon as typing
#   starts.
# Preconditions: as enrol-by-link.yaml.
# Personas: none (a door device).
appId: com.yayatoh.staff.preview
---
- runFlow: scan-setup.yaml
- tapOn:
    id: manual-open
- tapOn:
    id: manual-submit
- assertVisible: 'Enter a ticket code.'
- tapOn:
    id: manual-input
- inputText: A
- assertNotVisible: 'Enter a ticket code.'
- tapOn:
    id: manual-close
- assertVisible: 'Type a code'
