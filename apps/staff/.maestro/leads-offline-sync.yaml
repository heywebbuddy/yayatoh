# Journey: lead retrieval, offline then sync — an exhibitor rep captures a lead with no connection (the
#   badge code is typed, as the camera cannot be driven), it waits in the outbox, and when the connection is
#   back it is sent; the lead shows only what the attendee agreed to share (no email).
# Preconditions: as exhibitor-sign-in.yaml. Android only: Maestro's setAirplaneMode does not work on the iOS
#   simulator, so on iOS this is a device-pass step.
# Personas: the admin of a throwaway exhibitor (scripts/new-exhibitor.js), who holds a lead licence and has
#   accepted the lead terms; the badge is a registrant who did not agree to share her email.
appId: com.yayatoh.staff.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-exhibitor.js
- tapOn: 'Exhibitor: sign in'
- tapOn: 'Invitation link'
- inputText: ${output.inviteLink}
- tapOn: 'Email me a code'
- extendedWaitUntil:
    visible: 'We emailed a six-digit code.*'
    timeout: 20000
- runScript:
    file: scripts/last-code.js
    env:
      EMAIL: ${output.exhibitorEmail}
- tapOn: 'Six-digit code'
- inputText: ${output.code}
- tapOn: 'Verify and sign in'
- extendedWaitUntil:
    visible: 'Door tools'
    timeout: 30000
- tapOn:
    id: 'open-leads'
- extendedWaitUntil:
    visible: 'Your leads'
    timeout: 30000
- setAirplaneMode: enabled
- tapOn:
    id: 'leads-scan'
- tapOn:
    id: 'lead-code'
- inputText: ${output.badgeCode}
- tapOn:
    id: 'lead-code-use'
- tapOn:
    id: 'rating-hot'
- tapOn:
    id: 'lead-notes'
- inputText: 'Call after the keynote'
- tapOn:
    id: 'lead-save'
- assertVisible: 'Saved on this phone. It will be sent when you are online.'
- tapOn:
    id: 'lead-next'
- back
- assertVisible: '1 scan waiting to send'
# Back online: the queue goes out, the lead appears with only the shared fields.
- setAirplaneMode: disabled
- tapOn:
    id: 'leads-send'
- extendedWaitUntil:
    visible: 'Sent.'
    timeout: 30000
- assertNotVisible: '1 scan waiting to send'
- assertVisible: 'Hot'
- assertNotVisible: '.*@.*'
