# Journey: scan refusals — codes that must not get in: an unknown code, and a refunded ticket; each shows a
#   red panel, the words and the next step.
# Preconditions: as enrol-by-link.yaml, plus -e VOID_TICKET_CODE=<short code of a refunded ticket>.
# Personas: none (a door device); the refunded ticket is a seeded one.
appId: com.yayatoh.staff.preview
env:
  VOID_TICKET_CODE: ''
---
- runFlow: scan-setup.yaml
- tapOn:
    id: manual-open
- tapOn:
    id: manual-input
- inputText: ZZZZZZZZ
- tapOn:
    id: manual-submit
- assertVisible: 'Not recognised'
- assertVisible:
    id: verdict-glyph-stop
- tapOn:
    id: manual-input
- inputText: ${VOID_TICKET_CODE}
- tapOn:
    id: manual-submit
- assertVisible: 'Cancelled ticket'
- assertVisible: 'This ticket was refunded or cancelled. Do not admit.'
