# Journey: scan, camera denied — with camera permission refused the scanner says how to turn it on and still
#   lets staff type a code.
# Preconditions: as enrol-by-link.yaml, plus -e TICKET_CODE=<short code of an active ticket>.
# Personas: none (a door device).
appId: com.yayatoh.staff.preview
env:
  ENROL_EVENT: ''
  ENROL_KEY: ''
  TICKET_CODE: ''
---
- launchApp:
    clearState: true
    permissions:
      camera: deny
- openLink: 'yayatoh-staff-preview://scan#e=${ENROL_EVENT}&k=${ENROL_KEY}'
- extendedWaitUntil:
    visible: 'Where is this device scanning?'
    timeout: 30000
- tapOn: 'Whole event.*'
- extendedWaitUntil:
    visible: 'Camera access is off'
    timeout: 60000
- assertVisible: 'Open settings'
- tapOn: 'Type a code instead'
- tapOn:
    id: manual-input
- inputText: ${TICKET_CODE}
- tapOn:
    id: manual-submit
- assertVisible: 'Admit'
