# Journey: exhibitor sign-in — a rep pastes the invitation link, asks for a code, a link that is not an
#   invitation is refused without a request, a wrong code says so, and the emailed code signs in.
# Preconditions: an e2e build pointed at a server with YAYATOH_DEV_AUTH=1 and the seeded organization
#   lakeside-events; -e DEV_SERVER=<origin>. The code is read from the dev mailbox (scripts/last-code.js).
# Personas: the admin of a throwaway exhibitor with a lead licence (scripts/new-exhibitor.js).
appId: com.yayatoh.staff.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-exhibitor.js
- tapOn: 'Exhibitor: sign in'
- assertVisible: 'Exhibitor sign-in'
# Something that is not an invitation link is refused without a request.
- tapOn: 'Invitation link'
- inputText: 'hello'
- tapOn: 'Email me a code'
- assertVisible: 'That is not an invitation link.*'
- eraseText: 10
- inputText: ${output.inviteLink}
- tapOn: 'Email me a code'
- extendedWaitUntil:
    visible: 'We emailed a six-digit code.*'
    timeout: 20000
# A wrong code is refused and says how many tries are left.
- tapOn: 'Six-digit code'
- inputText: '000000'
- tapOn: 'Verify and sign in'
- assertVisible: 'That code is not right.*'
- runScript:
    file: scripts/last-code.js
    env:
      EMAIL: ${output.exhibitorEmail}
- tapOn: 'Six-digit code'
- eraseText: 6
- inputText: ${output.code}
- tapOn: 'Verify and sign in'
- extendedWaitUntil:
    notVisible: 'Exhibitor sign-in'
    timeout: 30000
