# Journey: door manual check-in — find a guest at the door and check them in by hand with a reason, offline;
#   the check-in is queued and syncs when the phone is back online, and a second try shows the duplicate.
# Preconditions: an enrolled device (enrol-by-link.yaml) whose guest list has downloaded (the scanner shows
#   it), and a seeded guest passed as -e GUEST_QUERY='ada love' -e GUEST_NAME='Ada Lovelace'
#   -e GUEST_CODE=ADA00001 whose pass is valid and unused. Android only (setAirplaneMode); on iOS the
#   offline half is a device-pass step.
# Personas: none (a door device); the guest is a seeded attendee.
appId: com.yayatoh.staff.preview
env:
  GUEST_QUERY: 'ada love'
  GUEST_NAME: 'Ada Lovelace'
  GUEST_CODE: 'ADA00001'
---
- openLink: yayatoh-staff-preview://tools/lookup
- assertVisible: 'Name, phone or email'
# Offline lookup works from the saved list: go offline first.
- setAirplaneMode: enabled
- tapOn:
    id: lookup-query
- inputText: ${GUEST_QUERY}
- tapOn:
    id: lookup-search
- assertVisible: ${GUEST_NAME}
- assertVisible: 'Searching the list saved on this phone.'
# A reason is required.
- tapOn:
    id: checkin-${GUEST_CODE}
- tapOn:
    id: manual-confirm
- assertVisible: 'Choose a reason.'
- tapOn:
    id: reason-wont_scan
- tapOn:
    id: manual-confirm
# Decided on the phone, queued for sync.
- assertVisible: 'Checked in'
- assertVisible: 'Decided on this phone. It will sync when you are back online.'
- tapOn:
    id: manual-done
- assertVisible: 'Already checked in on this phone today.'
# Back online: the queued scan syncs, and a second try shows the duplicate.
- setAirplaneMode: disabled
- tapOn:
    id: lookup-search
- tapOn:
    id: checkin-${GUEST_CODE}
- tapOn:
    id: reason-phone_dead
- tapOn:
    id: manual-confirm
- extendedWaitUntil:
    visible: 'Already checked in'
    timeout: 30000
