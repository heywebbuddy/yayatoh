# Journey: (sub-flow) the shared start of the scanner flows: a clean install, enrolled by link, an entrance
#   chosen, the guest list downloaded.
# Preconditions: as enrol-by-link.yaml; CHECKPOINT is the entrance to pick by name (default: the whole event).
# Personas: none.
appId: com.yayatoh.staff.preview
env:
  ENROL_EVENT: ''
  ENROL_KEY: ''
  CHECKPOINT: 'Whole event'
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
- openLink: 'yayatoh-staff-preview://scan#e=${ENROL_EVENT}&k=${ENROL_KEY}'
- extendedWaitUntil:
    visible: 'Where is this device scanning?'
    timeout: 30000
- tapOn: '${CHECKPOINT}.*'
# The list downloads once; after that scanning needs no connection.
- extendedWaitUntil:
    visible:
      id: scan-updated
    timeout: 60000
