# Journey: remote wipe — an organizer wipes the device from the console; within one heartbeat (30 s) the
#   app erases its token and data and shows the enrolment screen with the reason, and the old key is refused.
# Preconditions: as enrol-by-link.yaml. While the flow waits, an organizer clicks "Wipe" on that device in the
#   console (Devices); nothing in the app can do that, so this flow is not run in EAS.
# Personas: none (a door device); the organizer acts in the console.
appId: com.yayatoh.staff.preview
env:
  ENROL_EVENT: ''
  ENROL_KEY: ''
---
- launchApp:
    clearState: true
- openLink: 'yayatoh-staff-preview://scan#e=${ENROL_EVENT}&k=${ENROL_KEY}'
- extendedWaitUntil:
    visible: 'Where is this device scanning?'
    timeout: 30000
- tapOn: 'Whole event.*'
# Now the organizer wipes the device. One heartbeat is 30 seconds; allow two.
- extendedWaitUntil:
    visible: 'An organizer wiped this device.*'
    timeout: 70000
- assertVisible: 'Enrol this device'
# The token is gone: a restart still shows enrolment, and the old key is refused.
- stopApp
- launchApp
- assertVisible: 'Enrol this device'
- openLink: 'yayatoh-staff-preview://scan#e=${ENROL_EVENT}&k=${ENROL_KEY}'
- extendedWaitUntil:
    visible: 'This enrolment code is no longer valid.*'
    timeout: 30000
