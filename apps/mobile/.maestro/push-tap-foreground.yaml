# Device pass. A push while the app is open is an in-app banner; a tap opens its screen.
appId: ${APP_ID}
env:
  EVENT_SLUG: summit
---
- launchApp:
    clearState: true
    permissions: { notifications: allow }
- runFlow: sign-in-seeded.yaml
# Send it now from a second terminal: .maestro/send-push.sh event-changed
- extendedWaitUntil: { visible: \"Summit 2026\", timeout: 60000 }
- assertVisible: "Summit 2026"
- assertVisible: "The start time changed"
# No personal data on the banner.
- assertNotVisible: ${PERSONA_EMAIL}
- tapOn: "Summit 2026"
- assertVisible: "Summit"
