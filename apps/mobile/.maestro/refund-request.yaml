# Journey: refund request — from a ticket, the person reads the order's refund policy and asks the organizer
#   for a refund; the request shows as waiting.
# Preconditions: as subflows/prelude-ticket.yaml; the event's refund page says "Refunds up to a week before"
#   and the event is 30 days out, so the order allows a request. The paid pass is bought so the order has money.
# Personas: a throwaway buyer holding one Supporter ticket (bought on the fake provider).
appId: com.yayatoh.yayatohapp.preview
env:
  TICKET_TYPE: Supporter
---
- runFlow:
    file: subflows/prelude-ticket.yaml
    env:
      TICKET_TYPE: ${TICKET_TYPE}
- tapOn:
    text: 'Supporter for ${output.eventName}.*'
- scrollUntilVisible:
    element: 'Request a refund'
- tapOn: 'Request a refund'
- extendedWaitUntil:
    visible: 'Refund policy'
    timeout: 20000
- tapOn: 'Send request'
- extendedWaitUntil:
    visible: 'Request sent.*'
    timeout: 20000
- assertVisible: 'Your request'
