# Smoke flow (M7.1b, updated in M7.3a): a signed-out preview build opens on the welcome screen. Written, not run in
# cloud sessions (no simulator); the device pass runs it with `maestro test apps/mobile/.maestro`
# against a preview build (a development build opens the dev launcher first).
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Yayatoh'
- assertVisible: 'Continue with email'
