# Journey: launch smoke — a signed-out fresh install opens on the welcome screen with its sign-in choices.
# Preconditions: an e2e build (APP_ENV=preview) pointed at any reachable server; no sign-in needed.
#   A development build opens the dev launcher first, so this does not run against one.
# Personas: none.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Yayatoh'
- assertVisible: 'Continue with email'
- assertVisible: 'Use a password'
