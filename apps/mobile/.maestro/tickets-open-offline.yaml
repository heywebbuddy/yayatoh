# Journey: tickets open offline — after one sync, My tickets and the ticket's QR open with the network off
#   (also after a restart), and signing out removes them.
# Preconditions: as subflows/prelude-ticket.yaml. Android only: Maestro's setAirplaneMode does not work on
#   the iOS simulator, so on iOS this is a device-pass step (turn on airplane mode by hand).
# Personas: a throwaway buyer holding one free ticket (bought by the flow).
appId: com.yayatoh.yayatohapp.preview
---
- runFlow: subflows/prelude-ticket.yaml
# One sync happens when the tab opens.
- assertVisible: 'Upcoming'
- assertVisible: 'Last synced.*'
- tapOn:
    text: 'Free entry for ${output.eventName}.*'
- assertVisible:
    text: 'Ticket QR code for ${output.eventName}'
- assertVisible: 'Ticket code'
- back
# Network off, app restarted from the saved copy.
- setAirplaneMode: enabled
- launchApp
- extendedWaitUntil:
    visible: 'You’re offline.*'
    timeout: 20000
- assertVisible:
    text: '.*${output.eventName}.*'
- tapOn:
    text: 'Free entry for ${output.eventName}.*'
- assertVisible:
    text: 'Ticket QR code for ${output.eventName}'
- assertVisible: 'You’re offline. This is the copy saved on this phone.'
- setAirplaneMode: disabled
# Signing out removes the saved tickets: the next start is the welcome screen, not the list.
- back
- tapOn: 'Account, tab, 3 of 3'
- scrollUntilVisible:
    element:
      id: 'account-sign-out'
- tapOn:
    id: 'account-sign-out'
- tapOn:
    id: 'account-sign-out-confirm'
- extendedWaitUntil:
    visible: 'Welcome to Yayatoh'
    timeout: 20000
- assertNotVisible:
    text: '.*${output.eventName}.*'
