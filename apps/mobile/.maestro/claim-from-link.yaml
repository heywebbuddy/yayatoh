# Journey: claim from a link — person A sends a ticket to person B's address; B opens the claim link signed
#   out, signs in (the app brings B back to the claim), claims it, and the ticket opens.
# Preconditions: as subflows/prelude-ticket.yaml; the dev mailbox holds A's transfer email so
#   scripts/last-claim-link.js can read the claim token. One phone plays both people, one after the other.
# Personas: A = throwaway buyer holding a free ticket; B = a second throwaway account whose address A sends to.
appId: com.yayatoh.yayatohapp.preview
---
# B is made first: the transfer must go to B's verified address.
- runScript:
    file: scripts/new-user.js
- evalScript: ${output.emailB = output.email; output.passwordB = output.password}
- runFlow: subflows/prelude-ticket.yaml
- tapOn:
    text: 'Free entry for ${output.eventName}.*'
- scrollUntilVisible:
    element: 'Transfer ticket'
- tapOn: 'Transfer ticket'
- tapOn:
    id: 'to-name'
- inputText: 'Bea Claimer'
- tapOn:
    id: 'to-email'
- inputText: ${output.emailB}
- tapOn: 'Review transfer'
- tapOn: 'Send transfer'
- extendedWaitUntil:
    visible: 'Transfer sent'
    timeout: 20000
- tapOn: 'Done'
# A signs out; B opens the link from the email.
- tapOn: 'Account, tab, 3 of 3'
- scrollUntilVisible:
    element:
      id: 'account-sign-out'
- tapOn:
    id: 'account-sign-out'
- tapOn:
    id: 'account-sign-out-confirm'
- extendedWaitUntil:
    visible: 'Welcome to Yayatoh'
    timeout: 20000
- runScript:
    file: scripts/last-claim-link.js
    env:
      EMAIL: ${output.emailB}
- openLink: yayatoh-preview://claim/${output.claimToken}
- extendedWaitUntil:
    visible: 'Sign in to claim this ticket'
    timeout: 20000
- tapOn: 'Sign in'
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.emailB}
      PASSWORD: ${output.passwordB}
# Back on the claim screen after sign-in.
- extendedWaitUntil:
    visible: 'Claim your ticket'
    timeout: 20000
- assertVisible:
    text: '.*${output.eventName}.*'
- tapOn: 'Claim ticket'
- extendedWaitUntil:
    visible: 'The ticket is yours'
    timeout: 20000
- tapOn: 'View ticket'
- assertVisible:
    text: 'Ticket QR code for ${output.eventName}'
