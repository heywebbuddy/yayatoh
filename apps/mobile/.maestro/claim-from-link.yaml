# M7.3b: a claim link opens the claim screen; a signed-out person signs in first and is brought back to it.
# Written, not run in cloud sessions. Seed: CLAIM_TOKEN is the token of an open claim link (a plain
# claim link made by the organizer, or a transfer to tess@example.test).
appId: com.yayatoh.yayatohapp.preview
env:
  CLAIM_TOKEN: seeded-open-claim-token
  EVENT: Summer Night
---
- launchApp:
    clearState: true
- openLink: yayatoh-preview://claim/${CLAIM_TOKEN}
- assertVisible: 'Sign in to claim this ticket'
- tapOn: 'Sign in'
- runFlow: tickets-sign-in.yaml
# Back on the claim screen after sign-in.
- assertVisible: 'Claim your ticket'
- assertVisible:
    text: '.*${EVENT}.*'
- tapOn: 'Claim ticket'
- assertVisible: 'The ticket is yours'
- tapOn: 'View ticket'
- assertVisible:
    text: 'Ticket QR code for ${EVENT}'
