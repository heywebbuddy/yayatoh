# Journey: transfer a ticket and cancel the transfer — validation first, a review step, "Transfer sent",
#   the ticket stays the sender's and shows "Transfer pending", then a two-step cancel.
# Preconditions: as subflows/prelude-ticket.yaml; the free pass allows transfers (the API says so; if the
#   event's transfer rules change, the ticket screen says why and this flow stops at 'Transfer ticket').
# Personas: a throwaway buyer; the recipient is a made-up address nobody signs in as.
appId: com.yayatoh.yayatohapp.preview
env:
  RECIPIENT_NAME: Sam Rivera
  RECIPIENT_EMAIL: sam.rivera@example.test
---
- runFlow: subflows/prelude-ticket.yaml
- tapOn:
    text: 'Free entry for ${output.eventName}.*'
- scrollUntilVisible:
    element: 'Transfer ticket'
- tapOn: 'Transfer ticket'
# Validation first: nothing entered.
- tapOn: 'Review transfer'
- assertVisible: 'Enter the recipient’s name.'
- assertVisible: 'Enter a valid email address.'
- tapOn:
    id: 'to-name'
- inputText: ${RECIPIENT_NAME}
- tapOn:
    id: 'to-email'
- inputText: ${RECIPIENT_EMAIL}
- tapOn: 'Review transfer'
- assertVisible: 'Confirm transfer'
- tapOn: 'Send transfer'
- extendedWaitUntil:
    visible: 'Transfer sent'
    timeout: 20000
- tapOn: 'Done'
# The ticket stays the sender's until the recipient claims it.
- assertVisible: 'Transfer pending'
- assertVisible: 'Waiting for ${RECIPIENT_NAME} to claim this ticket.*'
- tapOn: 'Cancel transfer'
- assertVisible: 'Cancel the transfer to ${RECIPIENT_NAME}.*'
- tapOn:
    text: 'Cancel transfer'
    index: 1
- assertVisible: 'Transfer cancelled.'
- assertVisible: 'Transfer ticket'
