# Journey: sign in by email code — a new person asks for a code, a wrong code is refused with its message,
#   the right one signs in (the first sign-in creates the account), and the account shows the address as verified.
# Preconditions: an e2e build pointed (API_BASE_URL) at a server with YAYATOH_DEV_AUTH=1; pass the
#   server as -e DEV_SERVER=<origin> (a local Android emulator reaches the host as http://10.0.2.2:3000).
# Personas: none; the address is made up per run, and the code is read from the dev mailbox.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- evalScript: ${output.email = 'e2e-' + Date.now() + '@example.test'}
- assertVisible: 'Welcome to Yayatoh'
- tapOn: 'Continue with email'
- tapOn:
    id: 'email-input'
- inputText: ${output.email}
- tapOn: 'Send me a code'
- assertVisible: 'Check your email'
# A wrong code is refused with its own message, and the screen stays.
- tapOn:
    id: 'code-input'
- inputText: '000000'
- assertVisible: 'That code is wrong or has expired. Check it, or ask for a new one.'
- runScript:
    file: scripts/last-code.js
    env:
      EMAIL: ${output.email}
- tapOn:
    id: 'code-input'
- eraseText: 6
- inputText: ${output.code}
# The sixth digit signs in; the first sign-in creates the account.
- extendedWaitUntil:
    visible: 'Tickets, tab, 1 of 3'
    timeout: 20000
- assertVisible: 'Discover, tab, 2 of 3'
- tapOn: 'Account, tab, 3 of 3'
- assertVisible: ${output.email}
- assertVisible: 'Verified'
