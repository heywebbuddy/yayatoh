# Journey: push prompt "Not now" — answering Not now shows no phone sheet; opening a ticket does not ask
#   again; the next purchase asks again.
# Preconditions: as push-prompt-after-purchase.yaml.
# Personas: a throwaway buyer.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runScript:
    file: scripts/new-event.js
- runScript:
    file: scripts/new-user.js
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- runFlow:
    file: subflows/acquire-ticket.yaml
    env:
      EVENT_QUERY: ${output.eventQuery}
      EVENT_NAME: ${output.eventName}
      PUSH: leave
- extendedWaitUntil:
    visible: 'Get updates about your tickets?'
    timeout: 20000
- tapOn: 'Not now'
- assertNotVisible: 'Get updates about your tickets?'
# The phone was never asked, and opening a ticket does not ask.
- tapOn: 'View my tickets'
- tapOn:
    text: 'Free entry for ${output.eventName}.*'
- assertNotVisible: 'Get updates about your tickets?'
# A later purchase asks again.
- back
- runFlow:
    file: subflows/acquire-ticket.yaml
    env:
      EVENT_QUERY: ${output.eventQuery}
      EVENT_NAME: ${output.eventName}
      PUSH: leave
- extendedWaitUntil:
    visible: 'Get updates about your tickets?'
    timeout: 20000
- tapOn: 'Not now'
