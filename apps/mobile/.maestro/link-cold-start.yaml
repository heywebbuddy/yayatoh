# Journey: app link cold start — each app link opens its own screen from a closed app: an event page, a claim
#   link (an invalid token gets its message), and an order-email link (which hands over to the web).
#   These are the app-scheme forms (yayatoh-preview://...), which are the same routes the universal
#   links use; the https forms need a signed build and are link-universal.yaml.
# Preconditions: as subflows/prelude-signed-in.yaml.
# Personas: a throwaway buyer; the event comes from scripts/new-event.js.
appId: com.yayatoh.yayatohapp.preview
---
- runFlow: subflows/prelude-signed-in.yaml
- stopApp
- openLink: yayatoh-preview://events/${output.eventSlug}
- extendedWaitUntil:
    visible: '.*${output.eventName}.*'
    timeout: 30000
- stopApp
- openLink: yayatoh-preview://claim/not-a-real-claim-token
- extendedWaitUntil:
    visible: 'This link isn’t valid'
    timeout: 30000
- stopApp
- openLink: yayatoh-preview://orders/not-a-real-order-token
- extendedWaitUntil:
    visible: 'Open this order on the web'
    timeout: 30000
