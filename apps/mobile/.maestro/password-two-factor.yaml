# M7.3a: a password sign-in for an account with two-step verification asks for the second step;
# a wrong code is refused and a backup code completes it. Written, not run in cloud sessions.
# Device pass: see sign-in-email-code.yaml; also pass
#   -e DEV_PERSONA_PASSWORD=<the dev server's DEV_PERSONA_PASSWORD>
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-user.js
    env:
      TWO_FACTOR: '1'
- assertVisible: 'Welcome to Yayatoh'
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${output.email}
- tapOn:
    id: 'password-input'
- inputText: 'not the password'
- tapOn: 'Sign in'
- assertVisible: 'That email or password is not right.'
- tapOn:
    id: 'password-input'
- eraseText: 20
- inputText: ${output.password}
- tapOn: 'Sign in'
# The password is right, but the account is not signed in until the second step is done.
- assertVisible: 'Two-step verification'
- tapOn:
    id: 'two-factor-input'
- inputText: '000000'
- tapOn: 'Verify'
- assertVisible: 'That code is not right. Check it and try again.'
- tapOn:
    id: 'two-factor-input'
- eraseText: 6
- inputText: ${output.backupCode}
- tapOn: 'Verify'
- assertVisible: 'Tickets, tab, 1 of 3'
