# Journey: password sign-in with two-step verification — a wrong password is refused; the right one asks
#   for the second step; a wrong code is refused and a backup code completes sign-in.
# Preconditions: as sign-in-email-code.yaml, plus -e DEV_PERSONA_PASSWORD=<the e2e server's value>
#   (or MAESTRO_DEV_PERSONA_PASSWORD in the environment).
# Personas: a throwaway account with two-step verification on (scripts/new-user.js, TWO_FACTOR=1).
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-user.js
    env:
      TWO_FACTOR: '1'
- assertVisible: 'Welcome to Yayatoh'
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${output.email}
- tapOn:
    id: 'password-input'
- inputText: 'not the password'
- tapOn: 'Sign in'
- assertVisible: 'That email or password is not right.'
- tapOn:
    id: 'password-input'
- eraseText: 20
- inputText: ${output.password}
- tapOn: 'Sign in'
# The password is right, but the account is not signed in until the second step is done.
- extendedWaitUntil:
    visible: 'Two-step verification'
    timeout: 20000
- tapOn:
    id: 'two-factor-input'
- inputText: '000000'
- tapOn: 'Verify'
- assertVisible: 'That code is not right. Check it and try again.'
- tapOn:
    id: 'two-factor-input'
- eraseText: 6
- inputText: ${output.backupCode}
- tapOn: 'Verify'
- extendedWaitUntil:
    visible: 'Tickets, tab, 1 of 3'
    timeout: 20000
