# Journey: cancel payment — closing the payment page returns to the checkout with the selection intact, and
#   paying again makes one order, not two.
# Preconditions: as search-and-buy.yaml. On iOS the secure browser's own Cancel button closes the page; on
#   Android the system back button does.
# Personas: a throwaway buyer; the event comes from scripts/new-event.js.
appId: com.yayatoh.yayatohapp.preview
---
- runFlow: subflows/prelude-signed-in.yaml
- openLink: yayatoh-preview://events/${output.eventSlug}
- extendedWaitUntil:
    visible: '.*${output.eventName}.*'
    timeout: 30000
- scrollUntilVisible:
    element: 'Add one Supporter'
- tapOn: 'Add one Supporter'
- tapOn: 'Continue to checkout'
- tapOn:
    text: 'Pay .*'
- extendedWaitUntil:
    visible: 'Pay for your order'
    timeout: 30000
# Leave the payment page: the system sheet's Cancel on iOS, the back button on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Cancel'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: 'Payment not completed'
    timeout: 20000
- assertVisible: '1 × Supporter'
- assertVisible: 'Nothing was charged. Your tickets are still selected, so you can pay again.'
- tapOn: 'Pay again'
- extendedWaitUntil:
    visible: 'Pay for your order'
    timeout: 30000
- tapOn: 'Pay now (test)'
- extendedWaitUntil:
    visible: "You're going!"
    timeout: 30000
# One order, however many times the payment page was opened: the confirmation shows one line.
- assertVisible: '1 × Supporter'
- tapOn: 'View my tickets'
