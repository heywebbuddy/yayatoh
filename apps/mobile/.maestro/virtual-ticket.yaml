# Journey: virtual ticket shows "Buy on the web" — an online event offers no quantity controls and no checkout
#   (P7-7: live-stream access is sold on the web only); "Buy on the web" opens the event's web page.
# Preconditions: an ONLINE event is published on the e2e server and its slug is passed as
#   -e ONLINE_EVENT_SLUG=<slug>. No dev route creates an online event and the seed has none, so someone creates
#   one in the organizer console first; that is why this flow does not run in EAS.
# Personas: a throwaway buyer (scripts/new-user.js).
appId: com.yayatoh.yayatohapp.preview
env:
  ONLINE_EVENT_SLUG: ''
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-user.js
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- openLink: yayatoh-preview://events/${ONLINE_EVENT_SLUG}
- extendedWaitUntil:
    visible: 'Online event'
    timeout: 30000
- scrollUntilVisible:
    element: 'Buy on the web'
- assertVisible: 'Tickets with access to the live stream are sold on the website, not in the app.'
- assertNotVisible: 'Continue to checkout'
- assertNotVisible: 'Add one .*'
- tapOn: 'Buy on the web'
# The secure browser opens the event's page on the web (its content belongs to the web app).
- assertVisible:
    text: '.*'
