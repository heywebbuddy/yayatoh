# Journey: push prompt after purchase (P7-8) — nothing is asked at launch or while browsing; after the first
#   purchase the app explains first (what is sent, what never is), and only then shows the phone's own sheet;
#   Account > Notification settings then says notifications are on.
# Preconditions: as subflows/prelude-signed-in.yaml. The notification permission starts unset. The system
#   sheet's buttons are "Allow" on iOS and on Android 13+ (an emulator image older than API 33 has no sheet).
# Personas: a throwaway buyer.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- runScript:
    file: scripts/new-event.js
- runScript:
    file: scripts/new-user.js
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
# 1. Nothing is asked at launch or while browsing.
- assertVisible: 'Tickets, tab, 1 of 3'
- assertNotVisible: 'Get updates about your tickets?'
# 2. Buy with the fake provider; the confirmation comes up.
- runFlow:
    file: subflows/acquire-ticket.yaml
    env:
      EVENT_QUERY: ${output.eventQuery}
      EVENT_NAME: ${output.eventName}
      PUSH: leave
# 3. The explanation comes first and names what is sent and what never is.
- extendedWaitUntil:
    visible: 'Get updates about your tickets?'
    timeout: 20000
- assertVisible: 'Notifications show the event name and what changed, never your name, email, phone number, payment amount or ticket code.'
# 4. Only now the phone's own sheet.
- tapOn: 'Turn on notifications'
- tapOn: 'Allow'
- assertNotVisible: 'Get updates about your tickets?'
# 5. Account > Notification settings says it is on.
- tapOn: 'Account, tab, 3 of 3'
- tapOn:
    id: 'account-notifications'
- extendedWaitUntil:
    visible: 'Notifications are on'
    timeout: 20000
