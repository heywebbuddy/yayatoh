# M7.3b: a web "My tickets" link opens the ticket it names after sign-in. Written, not run in cloud
# sessions. Seed: HOLDER_TOKEN is a holder link for tess@example.test's event.
appId: com.yayatoh.yayatohapp.preview
env:
  HOLDER_TOKEN: seeded-holder-link-token
  EVENT: Summer Night
---
- launchApp:
    clearState: true
- openLink: yayatoh-preview://my-tickets/${HOLDER_TOKEN}
- assertVisible: 'Sign in to open your ticket'
- tapOn: 'Sign in'
- runFlow: tickets-sign-in.yaml
- assertVisible:
    text: 'Ticket QR code for ${EVENT}'
