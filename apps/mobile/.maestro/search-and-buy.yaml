# Journey: buy a ticket with the fake provider — search for the event, choose a paid pass, check out, pay on the
#   fake provider's page in the secure browser, return to the confirmation, and find the ticket in My tickets.
# Preconditions: as subflows/prelude-signed-in.yaml; PAYMENTS_PROVIDER unset on the server, so the hosted
#   payment page is the fake one ("Pay now (test)"); the event's organizer has a fake connected account
#   (scripts/new-event.js asks for payouts=active).
# Personas: a throwaway buyer; the event comes from scripts/new-event.js.
appId: com.yayatoh.yayatohapp.preview
---
- runFlow: subflows/prelude-signed-in.yaml
- tapOn: 'Discover, tab, 2 of 3'
- tapOn: 'Search events'
- inputText: ${output.eventQuery}
- extendedWaitUntil:
    visible: '.*${output.eventName}.*'
    timeout: 30000
- assertVisible: 'Soonest first'
- tapOn: '.*${output.eventName}.*'
# The event page: details first, then the passes with all-in prices.
- assertVisible: 'Tickets'
- scrollUntilVisible:
    element: 'Add one Supporter'
- tapOn: 'Add one Supporter'
- tapOn: 'Add one Supporter'
- assertVisible: '2 tickets.*'
- tapOn: 'Continue to checkout'
# Checkout: the lines, the total, then the hosted (fake) payment page in the secure browser.
- assertVisible: 'Checkout'
- assertVisible: '2 × Supporter'
- tapOn:
    text: 'Pay .*'
- extendedWaitUntil:
    visible: 'Pay for your order'
    timeout: 30000
- tapOn: 'Pay now (test)'
# The return link brings the person back to the confirmation.
- extendedWaitUntil:
    visible: "You're going!"
    timeout: 30000
- assertVisible: '2 × Supporter'
- tapOn: 'View my tickets'
- extendedWaitUntil:
    visible: '.*${output.eventName}.*'
    timeout: 30000
