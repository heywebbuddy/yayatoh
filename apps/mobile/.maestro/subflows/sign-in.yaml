# Journey: (sub-flow) sign in with a password, the shortest sign-in path to the tab shell.
# Preconditions: the app is open on the welcome screen; EMAIL and PASSWORD are passed by the caller
#   (from scripts/new-user.js: a throwaway account on the e2e server).
# Personas: none; the account is made per run.
appId: com.yayatoh.yayatohapp.preview
---
- assertVisible: 'Welcome to Yayatoh'
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'password-input'
- inputText: ${PASSWORD}
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Tickets, tab, 1 of 3'
    timeout: 20000
