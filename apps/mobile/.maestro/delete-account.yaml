# Journey: delete account (App Review 5.1.1(v)) — the screen says what goes and what organizers keep, asks
#   the person to prove it is them and to type their address, deletes, signs out and wipes the phone, and
#   the account no longer signs in.
# Preconditions: as password-two-factor.yaml (a server with YAYATOH_DEV_AUTH, DEV_PERSONA_PASSWORD passed).
# Personas: a throwaway password account (scripts/new-user.js), deleted by the flow.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-user.js
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- tapOn: 'Account, tab, 3 of 3'
- scrollUntilVisible:
    element: 'Delete account'
- tapOn: 'Delete account'
- assertVisible: 'What we delete'
- assertVisible: 'What organizers keep'
- tapOn: 'Continue'
# An account with only a password confirms with the password; the address is typed again.
- assertVisible: 'Enter your password.'
- tapOn:
    id: 'delete-proof'
- inputText: ${output.password}
- tapOn:
    id: 'delete-email'
- inputText: 'someone.else@example.test'
- tapOn: 'Delete my account permanently'
- assertVisible: "That doesn't match your email address."
- tapOn:
    id: 'delete-email'
- eraseText: 40
- inputText: ${output.email}
- tapOn: 'Delete my account permanently'
- extendedWaitUntil:
    visible: 'Your account was deleted'
    timeout: 30000
- tapOn: 'Done'
- assertVisible: 'Welcome to Yayatoh'
# The account is gone: the same email and password no longer sign in.
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${output.email}
- tapOn:
    id: 'password-input'
- inputText: ${output.password}
- tapOn: 'Sign in'
- assertVisible: 'That email or password is not right.'
