# M7.3a (App Review 5.1.1(v)): a person deletes their account from the app. It explains what goes
# and what organizers keep, asks them to confirm it is them and their address, deletes, signs out
# and wipes the phone, and the account no longer signs in. Written, not run in cloud sessions.
# Device pass: see password-two-factor.yaml for the options.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/new-user.js
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${output.email}
- tapOn:
    id: 'password-input'
- inputText: ${output.password}
- tapOn: 'Sign in'
- assertVisible: 'Tickets, tab, 1 of 3'
- tapOn: 'Account, tab, 3 of 3'
- scrollUntilVisible:
    element: 'Delete account'
- tapOn: 'Delete account'
- assertVisible: 'What we delete'
- assertVisible: 'What organizers keep'
- tapOn: 'Continue'
# An account with only a password confirms with the password; the address is typed again.
- assertVisible: 'Enter your password.'
- tapOn:
    id: 'delete-proof'
- inputText: ${output.password}
- tapOn:
    id: 'delete-email'
- inputText: 'someone.else@example.test'
- tapOn: 'Delete my account permanently'
- assertVisible: "That doesn't match your email address."
- tapOn:
    id: 'delete-email'
- eraseText: 40
- inputText: ${output.email}
- tapOn: 'Delete my account permanently'
- assertVisible: 'Your account was deleted'
- tapOn: 'Done'
- assertVisible: 'Welcome to Yayatoh'
# The account is gone: the same email and password no longer sign in.
- tapOn: 'Use a password'
- tapOn:
    id: 'password-email'
- inputText: ${output.email}
- tapOn:
    id: 'password-input'
- inputText: ${output.password}
- tapOn: 'Sign in'
- assertVisible: 'That email or password is not right.'
