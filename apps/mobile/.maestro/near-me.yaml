# Journey: near me — "Near me" asks for the location only when tapped (nothing at launch), then lists nearest
#   first; tapping again turns it off.
# Preconditions: as subflows/prelude-signed-in.yaml. The location permission starts unset. A simulator or
#   emulator needs a location set (Features > Location on iOS; the emulator's extended controls on Android).
# Personas: a throwaway buyer.
appId: com.yayatoh.yayatohapp.preview
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- runScript:
    file: scripts/new-user.js
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- tapOn: 'Discover, tab, 2 of 3'
- assertVisible: 'Find events'
# Nothing has asked for the location yet: no system dialog.
- assertNotVisible: 'Allow.*'
- tapOn: 'Near me'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Allow While Using App'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'While using the app'
- extendedWaitUntil:
    visible: 'Nearest first'
    timeout: 20000
# Tapping again turns it off.
- tapOn: 'Near me'
- assertVisible: 'Soonest first'
