# The production image (ADR 0024): built from main after CI and pushed to GitHub Container
# Registry as ghcr.io/heywebbuddy/yayatoh:<commit-sha>. Nothing deploys from here: the owner runs
# deploy/scripts/deploy.sh <commit-sha> on the server (docs/runbooks/deploy-contabo.md).
# Build arguments are not secret: GitHub repository variables (Settings → Variables → Actions).
name: image

on:
  push:
    branches: [main]
  # Pull requests that touch the image build it without pushing, so a broken image never reaches main.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/image.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: production image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars.NEXT_PUBLIC_APP_ORIGIN || 'https://app.yayatoh.com' }}
            SERVER_ACTIONS_ALLOWED_ORIGINS=${{ vars.SERVER_ACTIONS_ALLOWED_ORIGINS }}
            LEGACY_ORIGIN_URL=${{ vars.LEGACY_ORIGIN_URL }}
            LEGACY_ABC_ORIGIN_URL=${{ vars.LEGACY_ABC_ORIGIN_URL }}
            LEGACY_YAY_HOSTS=${{ vars.LEGACY_YAY_HOSTS }}
            LEGACY_ABC_HOSTS=${{ vars.LEGACY_ABC_HOSTS }}
            FRONT_DOOR_MAX_BODY=${{ vars.FRONT_DOOR_MAX_BODY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The database image (Postgres 18 + pgvector + pgBackRest) is built on the server; check it builds.
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request'
        with:
          context: deploy/postgres
          push: false
