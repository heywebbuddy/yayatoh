# Local development services. Development uses masked snapshots only — never production data.
services:
  postgres:
    # Postgres 18 with the pgvector extension (M6.12b matchmaking embeddings).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: yayatoh
    ports: ["5432:5432"]
    # Parallel queries over large tables (e.g. timed legacy-migration rehearsals) need more than
    # Docker's default 64 MB of shared memory.
    shm_size: 256mb
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["6379:6379"]
  gotenberg:
    # PDF rendering (ADR 0017). Set GOTENBERG_URL=http://localhost:3300 to enable ticket PDFs.
    image: gotenberg/gotenberg:8.37.0
    ports: ["3300:3000"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
