# Production on one server (ADR 0024). Run only through deploy/scripts/deploy.sh, which writes the
# runtime environment from Doppler to /run/yayatoh/app.env (tmpfs, root only) and picks the image.
#
#   caddy ── web (Next.js: site, organizer console, /api/v1)
#        └── admin (staff console)
#   worker (jobs, outbox relay, messaging)   gotenberg (PDFs)   postgres (18 + pgvector + pgBackRest)
#
# Only Caddy publishes ports. YAYATOH_ENV=production is fixed here, not only in Doppler, so a
# missing secret can never turn production into a development build (fakes, dev logins).
name: yayatoh

x-app: &app
  image: ${YAYATOH_IMAGE:?set by deploy.sh}
  env_file: [/run/yayatoh/app.env]
  environment: &app-env
    NODE_ENV: production
    YAYATOH_ENV: production
    GOTENBERG_URL: http://gotenberg:3000
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: 20m, max-file: "5" }

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set in /etc/yayatoh/deploy.env}
      APP_HOST: ${APP_HOST:-app.yayatoh.com}
      ADMIN_HOST: ${ADMIN_HOST:-admin.yayatoh.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, admin]
    logging: *logging

  web:
    <<: *app
    environment:
      <<: *app-env
      # The web runs as app_user only (roadmap §4.3): no migrator, platform_reader or superuser.
      MIGRATOR_DATABASE_URL: ""
      JOBS_DATABASE_URL: ""
      PLATFORM_READER_DATABASE_URL: ""
    working_dir: /app/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3000", "--keepAliveTimeout", "75000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  admin:
    <<: *app
    environment:
      <<: *app-env
      # The staff console reads across orgs through platform_reader (audited); never the migrator.
      MIGRATOR_DATABASE_URL: ""
      JOBS_DATABASE_URL: ""
    working_dir: /app/apps/admin
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3001", "--keepAliveTimeout", "75000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    environment:
      <<: *app-env
      # pg-boss owns its queue schema through JOBS_DATABASE_URL; the worker never runs migrations.
      MIGRATOR_DATABASE_URL: ""
    working_dir: /app/apps/worker
    command: ["node", "src/main.ts"]
    # pg-boss drains on SIGTERM (docs/runbooks/deploy.md).
    stop_grace_period: 30s

  # One-off tasks: `deploy.sh` runs `migrate` before starting the new apps; `bootstrap` once, at setup.
  migrate:
    <<: *app
    profiles: [tasks]
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "scripts/migrate.ts"]

  bootstrap:
    <<: *app
    # The only service that sees the database superuser (ADMIN_DATABASE_URL): creates the roles.
    env_file: [/run/yayatoh/app.env, /run/yayatoh/bootstrap.env]
    profiles: [tasks]
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "scripts/bootstrap.ts"]

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    restart: unless-stopped
    # Private network only (no published port); the app sends it the HTML to render.
    logging: *logging

  postgres:
    build: ./postgres
    image: yayatoh-postgres:18
    restart: unless-stopped
    shm_size: 1gb
    env_file: [/run/yayatoh/postgres.env]
    environment:
      POSTGRES_DB: yayatoh
      POSTGRES_USER: postgres
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-12GB}
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yayatoh"]
      interval: 5s
      retries: 30
    stop_grace_period: 60s
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  pgdata:
