packages:
  - apps/*
  - packages/*
  - packages/modules/*
  - tools/*

catalog:
  "@biomejs/biome": 2.5.14
  "@hono/node-server": 2.1.1
  "@hono/zod-openapi": 1.6.3
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@tailwindcss/postcss": 4.3.3
  "@types/node": ^24.0.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  hono: 4.13.9
  next: 16.3.6
  next-intl: 4.14.7
  pg-boss: 12.35.0
  postgres: 3.4.9
  react: 19.3.0
  react-dom: 19.3.0
  stripe: 22.6.2
  tailwindcss: 4.3.3
  turbo: 2.11.4
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5

# Batch 3l merge: one @opentelemetry/api, so drizzle-orm (an optional peer) resolves to one instance
# in every package (apps/zapier's tests pass drizzle SQL into @yayatoh/db's transactions).
overrides:
  "@opentelemetry/api": 1.9.1

allowBuilds:
  "@node-rs/argon2": true
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  sharp: true
  "@biomejs/biome": true
  vue-demi: false
  "@scarf/scarf": false
  "@sentry/cli": false

minimumReleaseAgeExclude:
  - pg-boss@12.35.0
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - '@expo/ui@57.0.23'
  - babel-preset-expo@57.0.15
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo-router@57.0.26
  - expo-splash-screen@57.0.10
  - expo-updates@57.0.26
  - expo@57.0.28
  - jest-expo@57.0.6

# Phase 7 (M7.1b, ADR 0025): the Expo apps pin the React and React Native that Expo SDK 57 expects.
# They live in a named catalog so the web's `catalog:` React (19.3.0) is never touched; the two
# trees never share a React because the apps import no package that declares one (check-modules).
# Versions are what `npx expo install --check` wants for SDK 57; bump them together with `expo`.
catalogs:
  mobile:
    expo: ~57.0.28
    expo-brightness: ~57.0.2
    expo-build-properties: ~57.0.22
    expo-calendar: ~57.0.5
    expo-constants: ~57.0.21
    expo-dev-client: ~57.0.20
    expo-doctor: 1.20.4
    expo-linking: ~57.0.12
    expo-router: ~57.0.26
    expo-splash-screen: ~57.0.10
    expo-status-bar: ~57.0.1
    expo-system-ui: ~57.0.4
    expo-updates: ~57.0.26
    jest: 29.7.0
    jest-expo: ~57.0.6
    react: 19.2.3
    react-native: 0.86.3
    react-native-gesture-handler: ~2.32.0
    react-native-reanimated: 4.5.1
    react-native-safe-area-context: ~5.7.0
    react-native-svg: 15.15.4
    react-native-screens: ~4.26.0
    react-native-worklets: 0.10.1
    react-test-renderer: 19.2.3
    "@react-native/jest-preset": 0.86.3
    "@react-native/metro-config": 0.86.3
    "@testing-library/react-native": 13.3.3
    "@types/jest": 29.5.14
    "@types/qrcode": 1.5.6
    qrcode: 1.5.4
    "@types/react": ~19.2.2
    intl-messageformat: 11.2.15
    use-intl: 4.14.9
    "@noble/ciphers": 2.4.0
    "@sentry/react-native": ~7.11.0
    "@tanstack/react-query": 5.104.2
    "@tanstack/react-query-persist-client": 5.104.2
    expo-application: ~57.0.3
    expo-auth-session: ~57.0.15
    expo-apple-authentication: ~57.0.2
    expo-crypto: ~57.0.4
    expo-file-system: ~57.0.7
    expo-localization: ~57.0.2
    expo-network: ~57.0.2
    expo-secure-store: ~57.0.4
    expo-web-browser: ~57.0.3
