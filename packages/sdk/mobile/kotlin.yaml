# openapi-generator config for the future Kotlin (Android) client (roadmap §6.1, §8.3). Generated
# in CI as an artifact (the `sdk-mobile` job, M6.3b), not published: mobile apps are deferred.
generatorName: kotlin
inputSpec: /local/apps/api/openapi.json
outputDir: /local/packages/sdk/mobile/out/kotlin
additionalProperties:
  packageName: com.yayatoh.api
  groupId: com.yayatoh
  artifactId: yayatoh-api
  library: jvm-ktor
  serializationLibrary: kotlinx_serialization
  dateLibrary: java8
  enumPropertyNaming: UPPERCASE
